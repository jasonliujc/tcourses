name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e "./backend[desktop]"
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: tcourses-${{ matrix.os }}
          path: dist/*.zip

  release:
    needs: build
    # One platform failing should not block publishing the other
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: TCourses ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*.zip
          body: |
            Download the zip for your platform, unzip it, and run **TCourses**, or **TCourses Demo** for a generated sample semester.
            Builds are not code-signed: on Windows choose *More info → Run anyway*; on macOS right-click the app and choose *Open*.
